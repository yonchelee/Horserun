name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - claude/horse-racing-game-fiALg
  workflow_dispatch:

# Serialize deploys so two pushes in quick succession don't race.
# `cancel-in-progress: false` lets the in-flight deploy finish before
# the next one starts, preserving the per-commit deploy guarantee.
concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Install the project-pinned wrangler (devDependencies) so the
      # action uses the same version as `npm run deploy:party` locally
      # rather than pulling in whatever wrangler version is current.
      - name: Install dependencies
        run: npm ci

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
